name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Bluetooth packages are optionalDependencies; a failed native install must not fail CI.
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --coverage
      - run: npm audit --omit=dev --audit-level=high

  web:
    name: Web UI build, unit and e2e tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix src/api/web-src
      - run: npm run build:web
      - name: Committed web-dist is up to date
        run: git diff --exit-code -- src/api/web-dist
      - run: npm run test:web
      - run: npx playwright install --with-deps
      - run: npm run test:e2e
